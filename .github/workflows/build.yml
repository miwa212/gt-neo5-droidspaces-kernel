name: Build senna Droidspaces GKI kernel

# realme GT Neo5 240W (RMX3708) / GT Neo5 / GT3 (senna) 专用
# 基于 realme AndroidU 内核源（kernel_platform）+ Droidspaces GKI kABI 补丁
# 社区构建链路参考: Quantom2/Realme-GT3-neo5-kernels

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        type: choice
        options: [droidspaces, stock, droidspaces_lto, stock_lto, patchonly_lto, cfgonly_lto, cfgA_lto, cfgB_lto, cfgB1_lto, cfgB2_lto, cfgA1_lto, cfgA2_lto, cfgA1a_lto, cfgA1b_lto, cfgA2a_lto, cfgA2b_lto, cfgK1_lto, cfgK2_lto, cfgK3_lto, cfgK4_lto, cfgK5_lto, modv_lto, modv2_lto, mq_lto, mq2_lto, mq3_lto, mq4_lto, sv1_lto, sv2_lto, mq4nm_lto]
        default: droidspaces
      make_release:
        description: '构建成功后创建 Release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  MANIFEST_URL: https://github.com/Quantom2/gt_neo5_kernel_manifest.git
  MANIFEST_BRANCH: oneplus/sm8475
  MANIFEST_XML: realme_gt_neo5.xml

jobs:
  build:
    runs-on: ubuntu-latest   # 免费 runner (4核/16GB)，保留原厂 thin LTO 做最小改动验证
    timeout-minutes: 300
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "=== 清理后磁盘空间 ==="
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
            libssl-dev libelf-dev repo python3-pip zip cpio
          pip3 install --user gdown
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync kernel sources
        run: |
          cd ~/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          repo init "$MANIFEST_URL" -b "$MANIFEST_BRANCH" -m "$MANIFEST_XML" \
            --depth=1 --no-tags
          success=false
          for i in 1 2 3; do
            if repo sync -c --no-clone-bundle --no-tags --optimized-fetch \
              -j"$(nproc)" --fail-fast; then
              success=true
              break
            fi
            echo "::warning::repo sync 第 $i 次失败，重试中..."
            sleep 30
          done
          [ "$success" = true ] || { echo "::error::repo sync 三次均失败"; exit 1; }
          echo "✅ kernel_platform 同步完成"
          df -h /

      - name: Add swap 32G (ThinLTO 链接需 >16G 内存)
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          swapon --show

      - name: Apply Droidspaces patches and config (variant=${{ inputs.variant }})
        run: |
          cd ~/kernel_platform
          case "${{ inputs.variant }}" in
            stock)
              echo "=== Build C 模式：不打 Droidspaces 补丁，仅关闭 LTO ==="
              sed -i 's/^CONFIG_LTO_CLANG_THIN=y/# CONFIG_LTO_CLANG_THIN is not set/' \
                ./common/arch/arm64/configs/gki_defconfig
              sed -i 's/^CONFIG_LTO_CLANG_FULL=y/# CONFIG_LTO_CLANG_FULL is not set/' \
                ./common/arch/arm64/configs/gki_defconfig
              grep -q '^CONFIG_LTO_NONE=y' ./common/arch/arm64/configs/gki_defconfig || \
                echo 'CONFIG_LTO_NONE=y' >> ./common/arch/arm64/configs/gki_defconfig
              if [ -f ./common/build.config.gki ]; then
                sed -i 's/check_defconfig//' ./common/build.config.gki
                echo "已禁用 check_defconfig"
              fi
              echo "=== defconfig LTO 相关变更 ==="
              grep -E 'CONFIG_LTO' ./common/arch/arm64/configs/gki_defconfig
              ;;
            stock_lto)
              echo "=== 纯 stock + 原厂 ThinLTO：不改任何配置（基准验证） ==="
              ;;
            droidspaces)
              echo "=== Build B 模式：Droidspaces 补丁 + 关 LTO ==="
              bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common
              ;;
            droidspaces_lto)
              echo "=== 目标版本：Droidspaces 补丁 + 原厂 ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common
              ;;
            patchonly_lto)
              echo "=== 二分F1：仅 kABI 补丁 + ThinLTO（不改配置） ==="
              KEEP_LTO=1 SKIP_CONFIG=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common
              ;;
            cfgonly_lto)
              echo "=== 二分F2：仅 defconfig 配置 + ThinLTO（不打补丁） ==="
              KEEP_LTO=1 SKIP_PATCHES=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common
              ;;
            cfgA_lto)
              echo "=== 二分G1：补丁 + 配置A组(9项: namespaces/tmpfs/addrtype) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS \
                CONFIG_DEVTMPFS CONFIG_USER_NS CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR \
                CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
              ;;
            cfgA1_lto)
              echo "=== 二分I1：补丁 + A1组(5项: sysvipc/mqueue/ipc_ns/pid_ns/devtmpfs) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS CONFIG_DEVTMPFS
              ;;
            cfgA2_lto)
              echo "=== 二分I2：补丁 + A2组(4项: user_ns/tmpfs_acl/tmpfs_xattr/addrtype) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_USER_NS CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR \
                CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
              ;;
            cfgA1a_lto)
              echo "=== 二分J1：补丁 + A1a(3项: sysvipc/mqueue/ipc_ns) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS
              ;;
            cfgA1b_lto)
              echo "=== 二分J2：补丁 + A1b(2项: pid_ns/devtmpfs) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_PID_NS CONFIG_DEVTMPFS
              ;;
            cfgA2a_lto)
              echo "=== 二分J3：补丁 + A2a(1项: user_ns) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_USER_NS
              ;;
            cfgA2b_lto)
              echo "=== 二分J4：补丁 + A2b(3项: tmpfs_acl/tmpfs_xattr/addrtype) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
              ;;
            cfgK1_lto)
              echo "=== 二分K1：补丁 + K1(2项: sysvipc/mqueue, 无 ipc_ns) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE
              ;;
            cfgK2_lto)
              echo "=== 二分K2：补丁 + K2(1项: ipc_ns) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_IPC_NS
              ;;
            cfgK3_lto)
              echo "=== 二分K3：补丁 + K3(1项: sysvipc) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC
              ;;
            cfgK4_lto)
              echo "=== 二分K4：补丁(SYSVIPC槽位1_2_3) + J1三项(sysvipc/mqueue/ipc_ns) + ThinLTO ==="
              KEEP_LTO=1 SYSVIPC_SLOTS=1_2_3 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS
              ;;
            cfgK5_lto)
              echo "=== 二分K5：补丁(SYSVIPC槽位3_4_5) + J1三项(sysvipc/mqueue/ipc_ns) + ThinLTO ==="
              KEEP_LTO=1 SYSVIPC_SLOTS=3_4_5 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS
              ;;
            modv_lto)
              echo "=== 测试M：Droidspaces补丁(自动槽位) + 完整18项配置 + 关闭MODVERSIONS + ThinLTO ==="
              echo "=== 原理: KABI槽位补丁保证布局兼容, 关闭MODVERSIONS绕过vendor模块CRC校验 ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common
              sed -i 's/^CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' ./common/arch/arm64/configs/gki_defconfig
              echo "=== MODVERSIONS 状态 ==="
              grep -n 'MODVERSIONS' ./common/arch/arm64/configs/gki_defconfig || true
              ;;
            modv2_lto)
              echo "=== 测试M2：补丁 + IPC_NS + 其余16项(无SYSVIPC/MQUEUE) + MODVERSIONS保持开启 + ThinLTO ==="
              echo "=== 目的: 验证除SYSVIPC/MQUEUE外的16项是否安全, 并dump最终.config ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_IPC_NS CONFIG_PID_NS CONFIG_DEVTMPFS \
                CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_USER_NS \
                CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE \
                CONFIG_NETFILTER_XT_TARGET_REJECT CONFIG_NETFILTER_XT_TARGET_LOG \
                CONFIG_NETFILTER_XT_MATCH_RECENT CONFIG_IP_SET CONFIG_IP_SET_HASH_IP \
                CONFIG_IP_SET_HASH_NET CONFIG_NETFILTER_XT_SET \
                CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR
              ;;
            mq_lto)
              echo "=== 测试MQ：补丁 + 仅POSIX_MQUEUE + IPC_NS(依赖满足可生效) 无SYSVIPC + ThinLTO ==="
              echo "=== 原理: IPC_NS depends on (SYSVIPC || POSIX_MQUEUE), 只开MQUEUE即可启用IPC_NS ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_POSIX_MQUEUE CONFIG_IPC_NS
              echo "=== 最终defconfig确认 ==="
              grep -n -E 'SYSVIPC|POSIX_MQUEUE|IPC_NS' ./common/arch/arm64/configs/gki_defconfig || true
              ;;
            mq2_lto)
              echo "=== 测试MQ2：mq_lto基础上补上PID_NS(orealme GKI默认关闭) ==="
              echo "=== 配置: POSIX_MQUEUE + IPC_NS + PID_NS, 无SYSVIPC ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS
              echo "=== 最终defconfig确认 ==="
              grep -n -E 'SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS' ./common/arch/arm64/configs/gki_defconfig || true
              ;;
            mq3_lto)
              echo "=== 测试MQ3：mq_lto基础上加 DEVTMPFS(含自动挂载) + USER_NS ==="
              echo "=== 配置: POSIX_MQUEUE + IPC_NS + DEVTMPFS_MOUNT + USER_NS, 无SYSVIPC无PID_NS ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_DEVTMPFS CONFIG_DEVTMPFS_MOUNT CONFIG_USER_NS
              echo "=== 最终defconfig确认 ==="
              grep -n -E 'SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|USER_NS' ./common/arch/arm64/configs/gki_defconfig || true
              ;;
            mq4_lto)
              echo "=== 测试MQ4：mq3_lto 基础上补 PID_NS（用户已验证无冲突） ==="
              echo "=== 配置: POSIX_MQUEUE + IPC_NS + DEVTMPFS_MOUNT + USER_NS + PID_NS, 无SYSVIPC ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_DEVTMPFS CONFIG_DEVTMPFS_MOUNT CONFIG_USER_NS CONFIG_PID_NS
              echo "=== 最终defconfig确认 ==="
              grep -n -E 'SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|USER_NS' ./common/arch/arm64/configs/gki_defconfig || true
              ;;
            sv1_lto)
              echo "=== SV1：SYSVIPC 冲刺 = mq4_lto 全套 + CONFIG_SYSVIPC + CRC 校验绕过 ==="
              echo "=== 原理: kABI padding 补丁保结构体布局不变 + 内核跳过模块符号 CRC 校验 ==="
              KEEP_LTO=1 BYPASS_MODVERSIONS=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS \
                CONFIG_DEVTMPFS CONFIG_DEVTMPFS_MOUNT CONFIG_USER_NS CONFIG_PID_NS
              echo "=== 最终defconfig确认 ==="
              grep -n -E 'SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|USER_NS' ./common/arch/arm64/configs/gki_defconfig || true
              ;;
            sv2_lto)
              echo "=== SV2：仅 CONFIG_SYSVIPC + CRC 绕过，不打任何 kABI 补丁（隔离补丁是否为毒药） ==="
              echo "=== 判据: 开机=kABI 补丁有问题; bootloop=SYSVIPC 本身与 vendor 冲突 ==="
              KEEP_LTO=1 SKIP_PATCHES=1 BYPASS_MODVERSIONS=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_SYSVIPC
              echo "=== 最终defconfig确认 ==="
              grep -n -E 'SYSVIPC|POSIX_MQUEUE|IPC_NS' ./common/arch/arm64/configs/gki_defconfig || true
              ;;
            mq4nm_lto)
              echo "=== MQ4-NM：mq4_lto 全套 + 禁用 midas 死机源（根治 panic） ==="
              echo "=== 死因: oplus_bsp_midas.ko 通过 android_vh_cpufreq_acct_update_power 挂载，"
              echo "    update_or_create_entry_locked 内 strncpy(entry->comm, entry->task->comm) 无 NULL 检查，"
              echo "    任务退出后 entry->task 残留 NULL，时钟 tick 命中该 entry 即内核 panic ==="
              echo "=== 修复: 移除 cpufreq_times.c 中的 hook 调用点，midas 永远不会被触发 ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_DEVTMPFS CONFIG_DEVTMPFS_MOUNT CONFIG_USER_NS CONFIG_PID_NS
              if grep -q 'trace_android_vh_cpufreq_acct_update_power' ./common/drivers/cpufreq/cpufreq_times.c; then
                sed -i 's/trace_android_vh_cpufreq_acct_update_power(cputime, p, state);/\/* midas-panic-fix: hook disabled, see death-logs analysis *\//' \
                  ./common/drivers/cpufreq/cpufreq_times.c
                echo "=== midas hook 已移除，确认补丁: ==="
                grep -n -A1 -B1 'midas-panic-fix' ./common/drivers/cpufreq/cpufreq_times.c
              else
                echo "::warning::未找到 trace_android_vh_cpufreq_acct_update_power，请人工检查 cpufreq_times.c"
              fi
              echo "=== 最终defconfig确认 ==="
              grep -n -E 'SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|USER_NS' ./common/arch/arm64/configs/gki_defconfig || true
              ;;
            cfgB_lto)
              echo "=== 二分G2：补丁 + 配置B组(9项: netfilter/ipset) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE \
                CONFIG_NETFILTER_XT_TARGET_REJECT CONFIG_NETFILTER_XT_TARGET_LOG \
                CONFIG_NETFILTER_XT_MATCH_RECENT CONFIG_IP_SET CONFIG_IP_SET_HASH_IP \
                CONFIG_IP_SET_HASH_NET CONFIG_NETFILTER_XT_SET
              ;;
            cfgB1_lto)
              echo "=== 二分H1：补丁 + B1组(5项: ip6 nat/masquerade + xt) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE \
                CONFIG_NETFILTER_XT_TARGET_REJECT CONFIG_NETFILTER_XT_TARGET_LOG \
                CONFIG_NETFILTER_XT_MATCH_RECENT
              ;;
            cfgB2_lto)
              echo "=== 二分H2：补丁 + B2组(4项: ipset 系列) + ThinLTO ==="
              KEEP_LTO=1 bash "$GITHUB_WORKSPACE/scripts/apply_droidspaces.sh" ./common \
                CONFIG_IP_SET CONFIG_IP_SET_HASH_IP CONFIG_IP_SET_HASH_NET \
                CONFIG_NETFILTER_XT_SET
              ;;
          esac
          echo "=== gki_defconfig 变更 ==="
          cd common
          git diff -- arch/arm64/configs/gki_defconfig || true

      - name: Build kernel
        run: |
          cd ~/
          LTOPARAM=none
          case "${{ inputs.variant }}" in *_lto) LTOPARAM=thin;; esac
          SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh wapio gki $LTOPARAM all disable
          echo "=== 构建产物检查 ==="
          ls -la ~/kernel_platform/out/msm-waipio-waipio-gki/gki_kernel/dist/ || true
          [ -f ~/kernel_platform/out/msm-waipio-waipio-gki/gki_kernel/dist/Image ] \
            || { echo "::error::Image 产物不存在，构建失败"; exit 1; }
          echo "=== 最终 .config 关键项诊断 ==="
          for f in ~/kernel_platform/out/msm-waipio-waipio-gki/gki_kernel/.config ~/kernel_platform/out/msm-waipio-waipio-gki/.config; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              grep -E '^(CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_MODVERSIONS|CONFIG_USER_NS|CONFIG_IP_SET|CONFIG_PID_NS|CONFIG_LTO)' "$f" | head -20
            fi
          done

      - name: Package AnyKernel3 flashable zip
        run: |
          mkdir -p ~/out_boot
          cd ~/
          git clone https://github.com/WildPlusKernel/AnyKernel3.git \
            -b gki-2.0 --depth=1
          cd AnyKernel3
          rm -rf .git .github
          cp ~/kernel_platform/out/msm-waipio-waipio-gki/gki_kernel/dist/Image ./Image
          zip -r9 ../senna-${{ inputs.variant }}-AnyKernel3.zip ./*
          mv ../senna-${{ inputs.variant }}-AnyKernel3.zip ~/out_boot/
          cp ~/kernel_platform/out/msm-waipio-waipio-gki/gki_kernel/dist/Image \
            ~/out_boot/senna-${{ inputs.variant }}-Image
          echo "=== AnyKernel3 打包完成 ==="
          ls -la ~/out_boot/

      - name: Repack boot.img (基于社区 stock boot，失败不影响产物)
        continue-on-error: true
        run: |
          mkdir -p ~/stock_boot ~/out_repack
          gdown "https://drive.google.com/uc?id=1PtSKw3jEZSyE1MhvzeUwy30wwv7D8_bQ" -O ~/stock_boot/boot.img
          cp ~/kernel_platform/out/msm-waipio-waipio-gki/dist/boot.img ~/custom-boot.img
          cd ~/
          ./kernel_platform/oplus/build/oplus_build_repack_bootimg.sh \
            -k ~/custom-boot.img -r ~/stock_boot/boot.img -o ~/out_repack/
          cp ~/out_repack/repacked-boot.img ~/out_boot/senna-droidspaces-boot.img \
            || echo "::warning::boot.img repack 失败，可改用 AnyKernel3 zip 刷入"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: senna-${{ inputs.variant }}-kernel
          path: /home/runner/out_boot/*
          if-no-files-found: error

      - name: Create Release
        if: inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: droidspaces-${{ github.run_number }}
          name: "Droidspaces kernel build #${{ github.run_number }}"
          files: /home/runner/out_boot/*
          body: |
            realme GT Neo5 240W (RMX3708/senna) Droidspaces 支持内核
            - 内核: realme AndroidU GKI 5.10 (android12-9 KMI)
            - 已应用 Droidspaces kABI 补丁 (SYSVIPC + POSIX_MQUEUE)
            - 刷入方式: recovery 刷 AnyKernel3 zip 或 fastboot flash boot boot.img
            - ⚠️ 刷前务必备份原厂 boot.img
